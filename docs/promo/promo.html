<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Status Promo</title>
<style>
:root {
  --stage: #0b0e14; --ink: #f0f3f6; --muted: #9198a1;
  --win: #1f1f1f; --bar: #181818; --side: #181818; --border: #2b2b2b; --fg: #cccccc;
  --guide: #3a3a3a; --sel: #37373d; --accent: #0078d4;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--stage); }
body { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
#fit { width: 1280px; height: 720px; transform-origin: center; }
#stage { position: relative; width: 1280px; height: 720px; overflow: hidden;
  background: radial-gradient(900px 500px at 15% 0%, #12305a55, transparent 70%),
              radial-gradient(800px 500px at 100% 100%, #0f5a3a40, transparent 70%), var(--stage);
  color: var(--ink); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
#brand { position: absolute; left: 40px; top: 22px; display: flex; align-items: center; gap: 10px;
  font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: .2px; }
#brand img { width: 26px; height: 26px; border-radius: 6px; }
#brand span { color: var(--muted); font-weight: 400; }
#caption { position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-size: 33px; font-weight: 600;
  letter-spacing: -.3px; white-space: nowrap; }
#caption code { font-family: "Cascadia Code", Consolas, monospace; font-size: 29px; color: #ffd866;
  background: #ffffff12; padding: 1px 8px; border-radius: 6px; }
#caption em { font-style: normal; color: #3cb371; }

#win { position: absolute; left: 70px; top: 128px; width: 1140px; height: 560px; background: var(--win);
  border: 1px solid #333; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px #000a, 0 0 0 1px #0006;
  transform-origin: 50% 40%; }
#title { height: 34px; background: var(--bar); border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 14px; font-size: 13px; color: #9d9d9d; position: relative; }
#title .dots { display: flex; gap: 8px; }
#title .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
#title .t { position: absolute; left: 0; right: 0; text-align: center; }
#body { display: flex; height: calc(100% - 34px); }
#act { width: 48px; background: var(--bar); border-right: 1px solid var(--border); padding-top: 10px; }
#act svg { display: block; margin: 8px auto 18px; width: 26px; height: 26px; }
#side { width: 410px; background: var(--side); border-right: 1px solid var(--border); }
#side .hdr { height: 36px; display: flex; align-items: center; padding-left: 20px; font-size: 12px; letter-spacing: .6px;
  color: #bbbbbb; }
#tree { position: relative; font-size: 16px; color: var(--fg); }
.row { position: relative; display: flex; align-items: center; height: 28px; padding-right: 16px; }
.row.sel { background: var(--sel); }
.row .chev { width: 18px; height: 18px; flex: none; color: #c5c5c5; }
.row .icon { width: 20px; height: 20px; flex: none; margin-right: 8px; position: relative; }
.row .icon svg { width: 20px; height: 20px; display: block; }
.row .name { flex: 1; white-space: nowrap; }
.row .badge { font-size: 15px; font-weight: 600; margin-left: 8px; font-variant-numeric: tabular-nums; }
.row .flash { position: absolute; inset: 0; pointer-events: none; }
.guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--guide); }
.tip { position: absolute; background: #202020; border: 1px solid #454545; color: #cccccc; font-size: 14px;
  padding: 5px 10px; border-radius: 4px; box-shadow: 0 4px 14px #0008; white-space: nowrap; z-index: 2; }

#ed { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#tabs { height: 38px; background: var(--bar); border-bottom: 1px solid var(--border); display: flex; }
.tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; color: #ffffff;
  background: var(--win); border-top: 2px solid var(--accent); border-right: 1px solid var(--border); }
.tab svg { width: 18px; height: 18px; }
.tab .x { color: #ffffff; width: 14px; text-align: center; font-size: 14px; }
#code { flex: 1; padding-top: 10px; font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-size: 17px;
  line-height: 28px; color: #cccccc; position: relative; }
.ln { display: flex; white-space: pre; position: relative; }
.ln .no { width: 56px; padding-right: 22px; text-align: right; color: #6e7681; flex: none; }
.ln.cur .no { color: #cccccc; }
.ln.cur { background: #ffffff08; }
.h { color: #569cd6; font-weight: bold; }
.b { color: #569cd6; font-weight: bold; }
.lk { color: #ce9178; }
.lu { color: #9d9d9d; text-decoration: underline; }
.lm { color: #6796e6; }
.word { position: relative; border-radius: 3px; }
.word.selw { background: #264f78; }
.caret { display: inline-block; width: 2px; height: 22px; background: #aeafad; vertical-align: -5px; margin-right: -2px; }
.hl { position: absolute; border: 2px solid #ffd866; border-radius: 6px; box-shadow: 0 0 22px #ffd86655; pointer-events: none; }
#keys { position: absolute; right: 26px; bottom: 24px; display: flex; gap: 6px; align-items: center; font-size: 18px;
  color: #ddd; font-family: "Segoe UI", sans-serif; }
#keys kbd { font: inherit; font-weight: 600; background: #2d2d2d; border: 1px solid #4a4a4a; border-bottom-width: 3px;
  border-radius: 7px; padding: 4px 12px; color: #fff; }
#status { height: 24px; background: #181818; border-top: 1px solid var(--border); }

#end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; background: #0b0e14d0; }
#end img { width: 112px; height: 112px; border-radius: 22px; box-shadow: 0 16px 50px #0009; }
#end h1 { font-size: 64px; margin: 22px 0 6px; letter-spacing: -1px; }
#end p { font-size: 25px; color: #c9d1d9; margin: 0 0 6px; }
#end .chips { display: flex; gap: 10px; margin-top: 26px; }
#end .chips span { font-size: 17px; padding: 7px 14px; border-radius: 999px; background: #ffffff10; border: 1px solid #ffffff22; color: #e6edf3; }
#end .url { margin-top: 22px; font-size: 20px; color: #6cb6ff; font-family: "Cascadia Code", Consolas, monospace; }
#fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>

function statusAt(r, t) { let s = null, at = -1, prev = null; for (const [tt, st] of r.ev) if (tt <= t) { prev = s; s = st; at = tt; } return { s, at, prev }; }

  let done = 0, counted = 0, on = true;
  for (const r of ROWS) { if (r.profile !== "task") continue; const { s } = statusAt(r, t); if (s === "plain") { on = false; break; }
    const l = lookOf(r, s); if (l.rollup === "skip") continue; counted++; if (l.rollup === "done") done++; }
  return on ? { done, counted, pct: 100 * done / counted } : null;
}

function editorAt(t) {

function renderTree(t, ed) {

      if (r.rollup && roll) {
        const last = TASK_SAVES.filter((x) => x <= t).pop() ?? 0;
        const before = rollupAt(last - 1e-3);
        const k = easeOut(ramp(t, last, last + 0.35));
        const p = before ? lerp(before.pct, roll.pct, k) : roll.pct;
        const full = roll.done >= roll.counted && k >= 1;

function mdLine(s) {

  if (k > 0 && !end.innerHTML) end.innerHTML = '<img alt="" src="' + ICON + '"><h1>Record Status</h1>'
    + "<p>The status inside your Markdown, on the file in the VS Code Explorer.</p>"
    + '<div class="chips"><span>Tasks</span><span>Decisions &amp; ADRs</span><span>Specs</span><span>Folder progress</span></div>'
    + '<div class="url">github.com/antvelm/vscode-record-status</div>';
  const inner = end.children;
  for (let i = 0; i < inner.length; i++) { const kk = easeOut(ramp(t, END + .2 + i * .12, END + .7 + i * .12)); inner[i].style.opacity = kk; inner[i].style.transform = "translateY(" + ((1 - kk) * 16) + "px)"; }
}

function renderAt(t) {
  const ed = editorAt(t);
  renderTree(t, ed); renderEditor(t, ed); renderCaption(t); renderEnd(t);
  // Fade in from black, and out at the very end so a loop is seamless.
  document.getElementById("fade").style.opacity = ramp(t, DURATION - .5, DURATION);
}
window.renderAt = renderAt; window.DURATION = DURATION;

// Live playback (skipped when a recorder drives renderAt).
function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 720); document.getElementById("fit").style.transform = "scale(" + s + ")"; }
if (!location.hash.includes("record")) {
  addEventListener("resize", fit); fit();
  const t0 = performance.now();
  (function loop() { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else renderAt(0);
</script>
</body>
</html>
